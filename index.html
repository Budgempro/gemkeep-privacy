<script>
var EMAIL="budgem.pro@gmail.com",UPDATED="2026-10-08";
var D={"en": {"name": "English", "dir": "ltr", "title": "Gemkeep – Privacy Policy", "upd": "Last updated", "intro": "Gemkeep is an offline personal budget app. This policy explains what information the app handles. In short: <b>your financial data stays on your device. We do not run a server, we do not have user accounts, and we do not collect, receive or sell your data.</b>", "s": [["1. Data stored on your device", "Everything you enter (transactions, accounts, categories, budgets, savings, recurring items, settings) is stored only in a local database on your phone. We cannot see it. If you uninstall the app or erase the phone, this data is deleted unless you made a backup file yourself."], ["2. Camera and photos (receipt scanning)", "If you choose to scan a receipt, the app asks for camera or photo access. The image is read by text recognition on your device, is not uploaded anywhere and is not saved by Gemkeep. Only the amount, date and merchant text you confirm are stored as a transaction."], ["3. Notifications", "If you turn them on, reminders and budget alerts are created locally on your device. No notification service of ours is involved."], ["4. App lock (passcode / biometrics)", "The passcode is stored in your device's secure storage. Fingerprint or face recognition is handled by your phone's operating system; Gemkeep never receives your biometric data."], ["5. Backups and exports", "When you create a backup file or export a PDF/CSV report, the file is created on your device and you decide where to send or save it (for example Files, Google Drive, iCloud or e-mail). The app does not send these files anywhere on its own."], ["6. Purchases", "Gemkeep Pro purchases are processed by Google Play or the Apple App Store. Payment details are handled by those companies and are never visible to us. Their own privacy policies apply to those transactions."], ["7. Analytics, ads and tracking", "Gemkeep contains no advertising, no analytics and no tracking tools, and does not share data with third parties."], ["8. Children", "Gemkeep is a general finance tool and is not directed at children under 13. Because we collect no personal data, we do not knowingly hold any information about children."], ["9. Changes", "If this policy changes, the new version will be posted on this page with a new date."], ["10. Contact", "Questions:"]]}, "tr": {"name": "Türkçe", "dir": "ltr", "title": "Gemkeep – Gizlilik Politikası", "upd": "Son güncelleme", "intro": "Gemkeep, internet gerektirmeyen kişisel bir bütçe uygulamasıdır. Bu politika uygulamanın hangi bilgileri işlediğini açıklar. Kısaca: <b>Finansal verileriniz yalnızca cihazınızda kalır. Sunucumuz ve kullanıcı hesabı yoktur; verilerinizi toplamaz, almaz ve satmayız.</b>", "s": [["1. Cihazınızda saklanan veriler", "Girdiğiniz her şey (işlemler, hesaplar, kategoriler, bütçeler, birikimler, tekrarlayan işlemler, ayarlar) yalnızca telefonunuzdaki yerel bir veritabanında tutulur. Bu verileri göremeyiz. Uygulamayı silerseniz veya telefonu sıfırlarsanız, kendiniz yedek dosyası oluşturmadıysanız bu veriler silinir."], ["2. Kamera ve fotoğraflar (fiş tarama)", "Fiş taramayı seçerseniz uygulama kamera veya fotoğraf erişimi ister. Görüntü cihazınızda metin tanıma ile okunur, hiçbir yere yüklenmez ve Gemkeep tarafından saklanmaz. Yalnızca onayladığınız tutar, tarih ve işyeri bilgisi işlem olarak kaydedilir."], ["3. Bildirimler", "Açarsanız hatırlatmalar ve bütçe uyarıları cihazınızda yerel olarak oluşturulur. Bizim bir bildirim sunucumuz yoktur."], ["4. Uygulama kilidi (parola / biyometri)", "Parola cihazınızın güvenli depolama alanında saklanır. Parmak izi veya yüz tanıma telefonunuzun işletim sistemi tarafından yönetilir; Gemkeep biyometrik verilerinizi hiçbir zaman almaz."], ["5. Yedekler ve dışa aktarma", "Yedek dosyası veya PDF/CSV raporu oluşturduğunuzda dosya cihazınızda oluşturulur ve nereye göndereceğinizi veya kaydedeceğinizi siz seçersiniz (örneğin Dosyalar, Google Drive, iCloud veya e-posta). Uygulama bu dosyaları kendiliğinden hiçbir yere göndermez."], ["6. Satın alımlar", "Gemkeep Pro satın alımları Google Play veya Apple App Store tarafından işlenir. Ödeme bilgileri bu şirketlerde kalır ve bize görünmez. Bu işlemlerde onların gizlilik politikaları geçerlidir."], ["7. Analitik, reklam ve izleme", "Gemkeep'de reklam, analitik veya izleme aracı yoktur ve verileri üçüncü taraflarla paylaşmaz."], ["8. Çocuklar", "Gemkeep genel amaçlı bir finans aracıdır ve 13 yaşın altındaki çocuklara yönelik değildir. Kişisel veri toplamadığımız için çocuklara ait bilgi de tutmayız."], ["9. Değişiklikler", "Politika değişirse yeni sürüm yeni tarihle bu sayfada yayımlanır."], ["10. İletişim", "Sorularınız için:"]]}, "es": {"name": "Español", "dir": "ltr", "title": "Gemkeep – Política de privacidad", "upd": "Última actualización", "intro": "Gemkeep es una app de presupuesto personal que funciona sin conexión. Esta política explica qué información maneja la app. En resumen: <b>tus datos financieros permanecen en tu dispositivo. No tenemos servidor ni cuentas de usuario, y no recopilamos, recibimos ni vendemos tus datos.</b>", "s": [["1. Datos almacenados en tu dispositivo", "Todo lo que introduces (transacciones, cuentas, categorías, presupuestos, ahorros, movimientos recurrentes, ajustes) se guarda solo en una base de datos local de tu teléfono. No podemos verlo. Si desinstalas la app o borras el teléfono, estos datos se eliminan salvo que hayas creado tú un archivo de copia de seguridad."], ["2. Cámara y fotos (escaneo de recibos)", "Si eliges escanear un recibo, la app solicita acceso a la cámara o a las fotos. La imagen se lee con reconocimiento de texto en tu dispositivo, no se sube a ningún sitio y Gemkeep no la guarda. Solo el importe, la fecha y el comercio que confirmes se guardan como transacción."], ["3. Notificaciones", "Si las activas, los recordatorios y las alertas de presupuesto se crean localmente en tu dispositivo. No interviene ningún servicio de notificaciones nuestro."], ["4. Bloqueo de la app (código / biometría)", "El código se guarda en el almacenamiento seguro de tu dispositivo. La huella o el reconocimiento facial los gestiona el sistema operativo de tu teléfono; Gemkeep nunca recibe tus datos biométricos."], ["5. Copias de seguridad y exportaciones", "Cuando creas una copia de seguridad o exportas un informe PDF/CSV, el archivo se crea en tu dispositivo y tú decides dónde enviarlo o guardarlo (por ejemplo Archivos, Google Drive, iCloud o correo). La app no envía estos archivos a ningún sitio por su cuenta."], ["6. Compras", "Las compras de Gemkeep Pro las procesan Google Play o la App Store de Apple. Esas empresas gestionan los datos de pago y nosotros nunca los vemos. Se aplican sus propias políticas de privacidad."], ["7. Analítica, anuncios y seguimiento", "Gemkeep no contiene publicidad, analítica ni herramientas de seguimiento, y no comparte datos con terceros."], ["8. Menores", "Gemkeep es una herramienta financiera general y no está dirigida a menores de 13 años. Como no recopilamos datos personales, no conservamos información sobre menores."], ["9. Cambios", "Si esta política cambia, la nueva versión se publicará en esta página con una nueva fecha."], ["10. Contacto", "Preguntas:"]]}, "fr": {"name": "Français", "dir": "ltr", "title": "Gemkeep – Politique de confidentialité", "upd": "Dernière mise à jour", "intro": "Gemkeep est une application de budget personnel utilisable hors ligne. Cette politique explique quelles informations l'application traite. En bref : <b>vos données financières restent sur votre appareil. Nous n'avons ni serveur ni compte utilisateur, et nous ne collectons, ne recevons ni ne vendons vos données.</b>", "s": [["1. Données stockées sur votre appareil", "Tout ce que vous saisissez (transactions, comptes, catégories, budgets, épargne, opérations récurrentes, réglages) est stocké uniquement dans une base de données locale sur votre téléphone. Nous ne pouvons pas le voir. Si vous désinstallez l'application ou effacez le téléphone, ces données sont supprimées, sauf si vous avez créé vous-même un fichier de sauvegarde."], ["2. Appareil photo et photos (scan de tickets)", "Si vous choisissez de scanner un ticket, l'application demande l'accès à l'appareil photo ou aux photos. L'image est lue par reconnaissance de texte sur votre appareil, n'est envoyée nulle part et n'est pas conservée par Gemkeep. Seuls le montant, la date et le commerçant que vous confirmez sont enregistrés comme transaction."], ["3. Notifications", "Si vous les activez, les rappels et alertes de budget sont créés localement sur votre appareil. Aucun service de notification de notre part n'intervient."], ["4. Verrouillage de l'application (code / biométrie)", "Le code est conservé dans le stockage sécurisé de votre appareil. L'empreinte ou la reconnaissance faciale est gérée par le système d'exploitation de votre téléphone ; Gemkeep ne reçoit jamais vos données biométriques."], ["5. Sauvegardes et exports", "Lorsque vous créez une sauvegarde ou exportez un rapport PDF/CSV, le fichier est créé sur votre appareil et vous choisissez où l'envoyer ou l'enregistrer (par exemple Fichiers, Google Drive, iCloud ou e-mail). L'application n'envoie jamais ces fichiers d'elle-même."], ["6. Achats", "Les achats Gemkeep Pro sont traités par Google Play ou l'App Store d'Apple. Ces sociétés gèrent les informations de paiement, que nous ne voyons jamais. Leurs propres politiques de confidentialité s'appliquent."], ["7. Analyse, publicité et suivi", "Gemkeep ne contient ni publicité, ni outil d'analyse, ni outil de suivi, et ne partage aucune donnée avec des tiers."], ["8. Enfants", "Gemkeep est un outil financier généraliste, non destiné aux enfants de moins de 13 ans. Comme nous ne collectons aucune donnée personnelle, nous ne détenons aucune information sur les enfants."], ["9. Modifications", "Si cette politique change, la nouvelle version sera publiée sur cette page avec une nouvelle date."], ["10. Contact", "Questions :"]]}, "de": {"name": "Deutsch", "dir": "ltr", "title": "Gemkeep – Datenschutzerklärung", "upd": "Zuletzt aktualisiert", "intro": "Gemkeep ist eine Offline-App für das persönliche Budget. Diese Erklärung beschreibt, welche Informationen die App verarbeitet. Kurz gesagt: <b>Deine Finanzdaten bleiben auf deinem Gerät. Wir betreiben keinen Server, es gibt keine Benutzerkonten, und wir erheben, empfangen oder verkaufen deine Daten nicht.</b>", "s": [["1. Auf deinem Gerät gespeicherte Daten", "Alles, was du eingibst (Buchungen, Konten, Kategorien, Budgets, Ersparnisse, wiederkehrende Einträge, Einstellungen), wird nur in einer lokalen Datenbank auf deinem Telefon gespeichert. Wir können es nicht einsehen. Wenn du die App deinstallierst oder das Telefon zurücksetzt, werden diese Daten gelöscht, sofern du nicht selbst eine Sicherungsdatei erstellt hast."], ["2. Kamera und Fotos (Belegscan)", "Wenn du einen Beleg scannen möchtest, fragt die App nach Zugriff auf Kamera oder Fotos. Das Bild wird auf deinem Gerät per Texterkennung gelesen, nirgendwohin hochgeladen und von Gemkeep nicht gespeichert. Nur Betrag, Datum und Händler, die du bestätigst, werden als Buchung gespeichert."], ["3. Benachrichtigungen", "Wenn du sie aktivierst, werden Erinnerungen und Budgetwarnungen lokal auf deinem Gerät erzeugt. Ein Benachrichtigungsdienst von uns ist nicht beteiligt."], ["4. App-Sperre (Code / Biometrie)", "Der Code wird im sicheren Speicher deines Geräts abgelegt. Fingerabdruck oder Gesichtserkennung werden vom Betriebssystem deines Telefons verwaltet; Gemkeep erhält deine biometrischen Daten nie."], ["5. Sicherungen und Exporte", "Wenn du eine Sicherungsdatei erstellst oder einen PDF/CSV-Bericht exportierst, entsteht die Datei auf deinem Gerät, und du entscheidest, wohin du sie sendest oder speicherst (z. B. Dateien, Google Drive, iCloud oder E-Mail). Die App sendet diese Dateien nicht von selbst irgendwohin."], ["6. Käufe", "Käufe von Gemkeep Pro werden von Google Play oder dem Apple App Store abgewickelt. Zahlungsdaten liegen bei diesen Unternehmen und sind für uns nie sichtbar. Es gelten deren eigene Datenschutzerklärungen."], ["7. Analyse, Werbung und Tracking", "Gemkeep enthält keine Werbung, keine Analyse- und keine Tracking-Werkzeuge und gibt keine Daten an Dritte weiter."], ["8. Kinder", "Gemkeep ist ein allgemeines Finanzwerkzeug und richtet sich nicht an Kinder unter 13 Jahren. Da wir keine personenbezogenen Daten erheben, speichern wir auch keine Informationen über Kinder."], ["9. Änderungen", "Wenn sich diese Erklärung ändert, wird die neue Fassung mit neuem Datum auf dieser Seite veröffentlicht."], ["10. Kontakt", "Fragen:"]]}, "pt": {"name": "Português", "dir": "ltr", "title": "Gemkeep – Política de privacidade", "upd": "Última atualização", "intro": "O Gemkeep é um aplicativo de orçamento pessoal que funciona offline. Esta política explica quais informações o aplicativo trata. Em resumo: <b>seus dados financeiros ficam no seu dispositivo. Não temos servidor nem contas de usuário, e não coletamos, recebemos nem vendemos seus dados.</b>", "s": [["1. Dados armazenados no seu dispositivo", "Tudo o que você insere (transações, contas, categorias, orçamentos, economias, itens recorrentes, configurações) fica apenas em um banco de dados local no seu telefone. Não conseguimos vê-lo. Se você desinstalar o aplicativo ou apagar o telefone, esses dados são excluídos, a menos que você mesmo tenha criado um arquivo de backup."], ["2. Câmera e fotos (leitura de recibos)", "Se você escolher escanear um recibo, o aplicativo pede acesso à câmera ou às fotos. A imagem é lida por reconhecimento de texto no seu dispositivo, não é enviada a lugar nenhum e não é guardada pelo Gemkeep. Apenas o valor, a data e o estabelecimento que você confirmar são salvos como transação."], ["3. Notificações", "Se você as ativar, lembretes e alertas de orçamento são criados localmente no seu dispositivo. Nenhum serviço de notificação nosso está envolvido."], ["4. Bloqueio do aplicativo (senha / biometria)", "A senha é guardada no armazenamento seguro do seu dispositivo. A impressão digital ou o reconhecimento facial são tratados pelo sistema operacional do telefone; o Gemkeep nunca recebe seus dados biométricos."], ["5. Backups e exportações", "Quando você cria um arquivo de backup ou exporta um relatório PDF/CSV, o arquivo é criado no seu dispositivo e você decide para onde enviá-lo ou salvá-lo (por exemplo Arquivos, Google Drive, iCloud ou e-mail). O aplicativo não envia esses arquivos para lugar nenhum por conta própria."], ["6. Compras", "As compras do Gemkeep Pro são processadas pelo Google Play ou pela App Store da Apple. Os dados de pagamento ficam com essas empresas e nunca são visíveis para nós. Aplicam-se as políticas de privacidade delas."], ["7. Análise, anúncios e rastreamento", "O Gemkeep não contém publicidade, análise nem ferramentas de rastreamento e não compartilha dados com terceiros."], ["8. Crianças", "O Gemkeep é uma ferramenta financeira geral e não é direcionado a menores de 13 anos. Como não coletamos dados pessoais, não mantemos informações sobre crianças."], ["9. Alterações", "Se esta política mudar, a nova versão será publicada nesta página com uma nova data."], ["10. Contato", "Dúvidas:"]]}, "id": {"name": "Bahasa Indonesia", "dir": "ltr", "title": "Gemkeep – Kebijakan Privasi", "upd": "Terakhir diperbarui", "intro": "Gemkeep adalah aplikasi anggaran pribadi yang bekerja offline. Kebijakan ini menjelaskan informasi apa yang diproses aplikasi. Singkatnya: <b>data keuangan Anda tetap berada di perangkat Anda. Kami tidak memiliki server maupun akun pengguna, dan kami tidak mengumpulkan, menerima, atau menjual data Anda.</b>", "s": [["1. Data yang disimpan di perangkat Anda", "Semua yang Anda masukkan (transaksi, akun, kategori, anggaran, tabungan, transaksi berulang, pengaturan) hanya disimpan di basis data lokal pada ponsel Anda. Kami tidak dapat melihatnya. Jika Anda menghapus aplikasi atau mereset ponsel, data ini akan terhapus kecuali Anda sendiri membuat berkas cadangan."], ["2. Kamera dan foto (pindai struk)", "Jika Anda memilih memindai struk, aplikasi meminta akses kamera atau foto. Gambar dibaca dengan pengenalan teks di perangkat Anda, tidak diunggah ke mana pun, dan tidak disimpan oleh Gemkeep. Hanya jumlah, tanggal, dan nama toko yang Anda konfirmasi yang disimpan sebagai transaksi."], ["3. Notifikasi", "Jika Anda mengaktifkannya, pengingat dan peringatan anggaran dibuat secara lokal di perangkat Anda. Tidak ada layanan notifikasi milik kami yang terlibat."], ["4. Kunci aplikasi (kode sandi / biometrik)", "Kode sandi disimpan di penyimpanan aman perangkat Anda. Sidik jari atau pengenalan wajah ditangani oleh sistem operasi ponsel Anda; Gemkeep tidak pernah menerima data biometrik Anda."], ["5. Cadangan dan ekspor", "Saat Anda membuat berkas cadangan atau mengekspor laporan PDF/CSV, berkas dibuat di perangkat Anda dan Anda sendiri yang menentukan ke mana mengirim atau menyimpannya (misalnya File, Google Drive, iCloud, atau email). Aplikasi tidak mengirim berkas ini ke mana pun secara otomatis."], ["6. Pembelian", "Pembelian Gemkeep Pro diproses oleh Google Play atau Apple App Store. Data pembayaran ditangani perusahaan tersebut dan tidak pernah terlihat oleh kami. Kebijakan privasi mereka berlaku untuk transaksi tersebut."], ["7. Analitik, iklan, dan pelacakan", "Gemkeep tidak berisi iklan, analitik, maupun alat pelacakan, dan tidak membagikan data kepada pihak ketiga."], ["8. Anak-anak", "Gemkeep adalah alat keuangan umum dan tidak ditujukan untuk anak di bawah 13 tahun. Karena kami tidak mengumpulkan data pribadi, kami tidak menyimpan informasi tentang anak-anak."], ["9. Perubahan", "Jika kebijakan ini berubah, versi baru akan dipublikasikan di halaman ini dengan tanggal baru."], ["10. Kontak", "Pertanyaan:"]]}, "ru": {"name": "Русский", "dir": "ltr", "title": "Gemkeep – Политика конфиденциальности", "upd": "Последнее обновление", "intro": "Gemkeep — приложение для личного бюджета, работающее без интернета. В этой политике описано, какую информацию обрабатывает приложение. Коротко: <b>ваши финансовые данные остаются на вашем устройстве. У нас нет сервера и учётных записей, и мы не собираем, не получаем и не продаём ваши данные.</b>", "s": [["1. Данные на вашем устройстве", "Всё, что вы вводите (операции, счета, категории, бюджеты, накопления, регулярные операции, настройки), хранится только в локальной базе данных на вашем телефоне. Мы не можем её видеть. Если вы удалите приложение или сотрёте данные телефона, эти данные будут удалены, если вы сами не создали файл резервной копии."], ["2. Камера и фото (сканирование чеков)", "Если вы решите отсканировать чек, приложение запросит доступ к камере или фотографиям. Изображение распознаётся на вашем устройстве, нигде не загружается и не сохраняется Gemkeep. Только подтверждённые вами сумма, дата и название магазина сохраняются как операция."], ["3. Уведомления", "Если вы их включите, напоминания и предупреждения о бюджете создаются локально на вашем устройстве. Наш сервис уведомлений не используется."], ["4. Блокировка приложения (пароль / биометрия)", "Пароль хранится в защищённом хранилище устройства. Отпечаток пальца и распознавание лица обрабатываются операционной системой телефона; Gemkeep никогда не получает ваши биометрические данные."], ["5. Резервные копии и экспорт", "Когда вы создаёте файл резервной копии или экспортируете отчёт PDF/CSV, файл создаётся на вашем устройстве, и вы сами решаете, куда его отправить или сохранить (например, «Файлы», Google Drive, iCloud или e-mail). Приложение само никуда эти файлы не отправляет."], ["6. Покупки", "Покупки Gemkeep Pro обрабатываются Google Play или Apple App Store. Платёжные данные остаются у этих компаний и нам не видны. К таким операциям применяются их собственные политики конфиденциальности."], ["7. Аналитика, реклама и отслеживание", "В Gemkeep нет рекламы, аналитики и средств отслеживания, и данные не передаются третьим лицам."], ["8. Дети", "Gemkeep — универсальный финансовый инструмент, не предназначенный для детей младше 13 лет. Поскольку мы не собираем персональные данные, у нас нет информации о детях."], ["9. Изменения", "Если политика изменится, новая версия будет опубликована на этой странице с новой датой."], ["10. Контакты", "Вопросы:"]]}, "zh": {"name": "中文", "dir": "ltr", "title": "Gemkeep – 隐私政策", "upd": "最后更新", "intro": "Gemkeep 是一款可离线使用的个人预算应用。本政策说明应用会处理哪些信息。简而言之：<b>您的财务数据只保存在您的设备上。我们没有服务器，也没有用户账户，不会收集、接收或出售您的数据。</b>", "s": [["1. 保存在您设备上的数据", "您输入的所有内容（交易、账户、分类、预算、储蓄、定期项目、设置）仅保存在手机本地数据库中，我们无法查看。如果您卸载应用或清除手机，这些数据将被删除，除非您自己创建了备份文件。"], ["2. 相机和照片（扫描小票）", "如果您选择扫描小票，应用会请求相机或照片权限。图像在您的设备上通过文字识别读取，不会上传到任何地方，Gemkeep 也不会保存。只有您确认的金额、日期和商户名称会作为交易保存。"], ["3. 通知", "如果您开启通知，提醒和预算警告会在您的设备上本地生成，不涉及我们的任何通知服务。"], ["4. 应用锁（密码 / 生物识别）", "密码保存在设备的安全存储中。指纹或面部识别由手机操作系统处理，Gemkeep 永远不会获取您的生物识别数据。"], ["5. 备份和导出", "当您创建备份文件或导出 PDF/CSV 报告时，文件在您的设备上生成，由您决定发送或保存到哪里（例如“文件”、Google Drive、iCloud 或电子邮件）。应用不会自行把这些文件发送到任何地方。"], ["6. 购买", "Gemkeep Pro 的购买由 Google Play 或 Apple App Store 处理。支付信息由这些公司处理，我们无法看到。相关交易适用其各自的隐私政策。"], ["7. 分析、广告和跟踪", "Gemkeep 不含广告、分析或跟踪工具，也不会与第三方共享数据。"], ["8. 儿童", "Gemkeep 是通用的财务工具，并非面向 13 岁以下儿童。由于我们不收集个人数据，因此也不持有任何儿童信息。"], ["9. 变更", "如果本政策发生变化，新版本将连同新日期发布在本页面上。"], ["10. 联系方式", "如有疑问："]]}, "ja": {"name": "日本語", "dir": "ltr", "title": "Gemkeep – プライバシーポリシー", "upd": "最終更新日", "intro": "Gemkeep はオフラインで使える個人向け家計簿アプリです。このポリシーでは、アプリが扱う情報について説明します。要点：<b>お金に関するデータは端末の中だけに保存されます。当方にはサーバーもユーザーアカウントもなく、データを収集・受信・販売することはありません。</b>", "s": [["1. 端末に保存されるデータ", "入力した内容（取引、口座、カテゴリ、予算、貯蓄、定期項目、設定）は、スマートフォン内のローカルデータベースにのみ保存されます。当方からは見ることができません。アプリを削除したり端末を初期化したりすると、ご自身でバックアップファイルを作成していない限り、これらのデータは削除されます。"], ["2. カメラと写真（レシートのスキャン）", "レシートのスキャンを選ぶと、アプリはカメラまたは写真へのアクセスを求めます。画像は端末上で文字認識によって読み取られ、どこにもアップロードされず、Gemkeep にも保存されません。確認した金額・日付・店名だけが取引として保存されます。"], ["3. 通知", "オンにした場合、リマインダーや予算の警告は端末内でローカルに作成されます。当方の通知サービスは関与しません。"], ["4. アプリロック（パスコード / 生体認証）", "パスコードは端末の安全な保管領域に保存されます。指紋認証や顔認証はスマートフォンの OS が処理し、Gemkeep が生体情報を受け取ることはありません。"], ["5. バックアップとエクスポート", "バックアップファイルを作成したり PDF/CSV レポートを書き出したりすると、ファイルは端末上に作成され、送信先や保存先（ファイル、Google ドライブ、iCloud、メールなど）はご自身で決めます。アプリがこれらのファイルを自動的にどこかへ送信することはありません。"], ["6. 購入", "Gemkeep Pro の購入は Google Play または Apple App Store が処理します。支払い情報はそれらの会社が扱い、当方には見えません。これらの取引にはそれぞれのプライバシーポリシーが適用されます。"], ["7. 分析・広告・トラッキング", "Gemkeep には広告、分析、トラッキングのツールは含まれず、第三者とデータを共有することもありません。"], ["8. お子様", "Gemkeep は一般的な金融ツールであり、13 歳未満のお子様を対象としていません。個人データを収集しないため、お子様に関する情報も保有していません。"], ["9. 変更", "本ポリシーが変更された場合は、新しい日付とともに新版をこのページに掲載します。"], ["10. お問い合わせ", "ご質問："]]}, "hi": {"name": "हिन्दी", "dir": "ltr", "title": "Gemkeep – गोपनीयता नीति", "upd": "अंतिम अपडेट", "intro": "Gemkeep एक ऑफ़लाइन व्यक्तिगत बजट ऐप है। यह नीति बताती है कि ऐप कौन सी जानकारी संभालता है। संक्षेप में: <b>आपका वित्तीय डेटा आपके डिवाइस पर ही रहता है। हमारे पास कोई सर्वर या उपयोगकर्ता खाते नहीं हैं, और हम आपका डेटा न इकट्ठा करते हैं, न प्राप्त करते हैं, न बेचते हैं।</b>", "s": [["1. आपके डिवाइस पर सहेजा गया डेटा", "आप जो कुछ भी दर्ज करते हैं (लेन-देन, खाते, श्रेणियाँ, बजट, बचत, आवर्ती प्रविष्टियाँ, सेटिंग्स) वह केवल आपके फ़ोन के स्थानीय डेटाबेस में सहेजा जाता है। हम इसे नहीं देख सकते। यदि आप ऐप हटा देते हैं या फ़ोन मिटा देते हैं, तो यह डेटा हट जाएगा, जब तक आपने स्वयं बैकअप फ़ाइल न बनाई हो।"], ["2. कैमरा और फ़ोटो (रसीद स्कैन)", "यदि आप रसीद स्कैन करना चुनते हैं, तो ऐप कैमरा या फ़ोटो की अनुमति माँगता है। तस्वीर आपके डिवाइस पर टेक्स्ट पहचान से पढ़ी जाती है, कहीं अपलोड नहीं होती और Gemkeep उसे सहेजता नहीं है। केवल वही राशि, तारीख और दुकान का नाम लेन-देन के रूप में सहेजा जाता है जिसकी आप पुष्टि करते हैं।"], ["3. सूचनाएँ", "यदि आप इन्हें चालू करते हैं, तो अनुस्मारक और बजट अलर्ट आपके डिवाइस पर स्थानीय रूप से बनाए जाते हैं। इसमें हमारी कोई सूचना सेवा शामिल नहीं है।"], ["4. ऐप लॉक (पासकोड / बायोमेट्रिक)", "पासकोड आपके डिवाइस के सुरक्षित स्टोरेज में रखा जाता है। फ़िंगरप्रिंट या चेहरे की पहचान आपके फ़ोन का ऑपरेटिंग सिस्टम संभालता है; Gemkeep को आपका बायोमेट्रिक डेटा कभी नहीं मिलता।"], ["5. बैकअप और एक्सपोर्ट", "जब आप बैकअप फ़ाइल बनाते हैं या PDF/CSV रिपोर्ट एक्सपोर्ट करते हैं, तो फ़ाइल आपके डिवाइस पर बनती है और आप तय करते हैं कि उसे कहाँ भेजना या सहेजना है (जैसे फ़ाइलें, Google Drive, iCloud या ईमेल)। ऐप ये फ़ाइलें अपने आप कहीं नहीं भेजता।"], ["6. खरीदारी", "Gemkeep Pro की खरीदारी Google Play या Apple App Store द्वारा संसाधित होती है। भुगतान संबंधी जानकारी उन कंपनियों के पास रहती है और हमें कभी दिखाई नहीं देती। उन लेन-देन पर उनकी अपनी गोपनीयता नीतियाँ लागू होती हैं।"], ["7. एनालिटिक्स, विज्ञापन और ट्रैकिंग", "Gemkeep में कोई विज्ञापन, एनालिटिक्स या ट्रैकिंग टूल नहीं है, और यह तीसरे पक्षों के साथ डेटा साझा नहीं करता।"], ["8. बच्चे", "Gemkeep एक सामान्य वित्त उपकरण है और 13 वर्ष से कम उम्र के बच्चों के लिए नहीं है। चूँकि हम व्यक्तिगत डेटा इकट्ठा नहीं करते, इसलिए हमारे पास बच्चों की कोई जानकारी नहीं है।"], ["9. बदलाव", "यदि यह नीति बदलती है, तो नया संस्करण नई तारीख के साथ इसी पेज पर प्रकाशित किया जाएगा।"], ["10. संपर्क", "प्रश्न:"]]}, "ar": {"name": "العربية", "dir": "rtl", "title": "Gemkeep – سياسة الخصوصية", "upd": "آخر تحديث", "intro": "Gemkeep تطبيق ميزانية شخصية يعمل دون إنترنت. توضح هذه السياسة المعلومات التي يتعامل معها التطبيق. باختصار: <b>تبقى بياناتك المالية على جهازك. ليس لدينا خادم ولا حسابات مستخدمين، ولا نجمع بياناتك ولا نستلمها ولا نبيعها.</b>", "s": [["1. البيانات المخزَّنة على جهازك", "كل ما تدخله (المعاملات والحسابات والفئات والميزانيات والمدخرات والبنود المتكررة والإعدادات) يُحفظ فقط في قاعدة بيانات محلية على هاتفك. لا يمكننا الاطلاع عليه. إذا حذفت التطبيق أو مسحت الهاتف فستُحذف هذه البيانات ما لم تكن قد أنشأت ملف نسخة احتياطية بنفسك."], ["2. الكاميرا والصور (مسح الإيصالات)", "إذا اخترت مسح إيصال، يطلب التطبيق الوصول إلى الكاميرا أو الصور. تُقرأ الصورة بالتعرف على النص على جهازك، ولا تُرفع إلى أي مكان، ولا يحفظها Gemkeep. يُحفظ كمعاملة فقط المبلغ والتاريخ واسم المتجر الذي تؤكده."], ["3. الإشعارات", "إذا فعّلتها، تُنشأ التذكيرات وتنبيهات الميزانية محليًا على جهازك. لا تشارك فيها أي خدمة إشعارات تابعة لنا."], ["4. قفل التطبيق (رمز المرور / القياسات الحيوية)", "يُحفظ رمز المرور في التخزين الآمن لجهازك. يتولى نظام تشغيل هاتفك التعامل مع بصمة الإصبع أو التعرف على الوجه؛ ولا يستلم Gemkeep بياناتك الحيوية أبدًا."], ["5. النسخ الاحتياطي والتصدير", "عند إنشاء ملف نسخة احتياطية أو تصدير تقرير PDF/CSV، يُنشأ الملف على جهازك وأنت من يقرر أين ترسله أو تحفظه (مثل الملفات أو Google Drive أو iCloud أو البريد الإلكتروني). لا يرسل التطبيق هذه الملفات إلى أي مكان من تلقاء نفسه."], ["6. عمليات الشراء", "تتم معالجة مشتريات Gemkeep Pro عبر Google Play أو Apple App Store. تتعامل هاتان الشركتان مع بيانات الدفع ولا تظهر لنا أبدًا. تنطبق عليها سياسات الخصوصية الخاصة بهما."], ["7. التحليلات والإعلانات والتتبع", "لا يحتوي Gemkeep على إعلانات أو أدوات تحليلات أو تتبع، ولا يشارك البيانات مع أطراف ثالثة."], ["8. الأطفال", "Gemkeep أداة مالية عامة وغير موجهة للأطفال دون 13 عامًا. وبما أننا لا نجمع بيانات شخصية، فلا نحتفظ بأي معلومات عن الأطفال."], ["9. التغييرات", "إذا تغيّرت هذه السياسة، فستُنشر النسخة الجديدة في هذه الصفحة بتاريخ جديد."], ["10. التواصل", "للاستفسار:"]]}, "ur": {"name": "اردو", "dir": "rtl", "title": "Gemkeep – رازداری کی پالیسی", "upd": "آخری تازہ کاری", "intro": "Gemkeep ایک آف لائن ذاتی بجٹ ایپ ہے۔ یہ پالیسی بتاتی ہے کہ ایپ کون سی معلومات استعمال کرتی ہے۔ مختصراً: <b>آپ کا مالی ڈیٹا آپ کے آلے پر ہی رہتا ہے۔ ہمارا کوئی سرور یا صارف اکاؤنٹ نہیں ہے، اور ہم آپ کا ڈیٹا نہ جمع کرتے ہیں، نہ وصول کرتے ہیں، نہ بیچتے ہیں۔</b>", "s": [["1. آپ کے آلے پر محفوظ ڈیٹا", "آپ جو کچھ درج کرتے ہیں (لین دین، اکاؤنٹس، زمرے، بجٹ، بچت، بار بار ہونے والے اندراجات، ترتیبات) وہ صرف آپ کے فون کے مقامی ڈیٹا بیس میں محفوظ ہوتا ہے۔ ہم اسے نہیں دیکھ سکتے۔ اگر آپ ایپ حذف کر دیں یا فون مٹا دیں تو یہ ڈیٹا حذف ہو جاتا ہے، سوائے اس کے کہ آپ نے خود بیک اپ فائل بنائی ہو۔"], ["2. کیمرا اور تصاویر (رسید اسکین)", "اگر آپ رسید اسکین کرنا چنیں تو ایپ کیمرے یا تصاویر تک رسائی مانگتی ہے۔ تصویر آپ کے آلے پر متن کی شناخت سے پڑھی جاتی ہے، کہیں اپ لوڈ نہیں ہوتی اور Gemkeep اسے محفوظ نہیں کرتا۔ صرف وہ رقم، تاریخ اور دکان کا نام لین دین کے طور پر محفوظ ہوتا ہے جس کی آپ تصدیق کریں۔"], ["3. اطلاعات", "اگر آپ انہیں آن کریں تو یاد دہانیاں اور بجٹ الرٹس آپ کے آلے پر مقامی طور پر بنتے ہیں۔ ہماری کوئی اطلاعاتی سروس اس میں شامل نہیں۔"], ["4. ایپ لاک (پاس کوڈ / بایومیٹرک)", "پاس کوڈ آپ کے آلے کی محفوظ اسٹوریج میں رکھا جاتا ہے۔ فنگر پرنٹ یا چہرے کی شناخت آپ کے فون کا آپریٹنگ سسٹم سنبھالتا ہے؛ Gemkeep کو آپ کا بایومیٹرک ڈیٹا کبھی نہیں ملتا۔"], ["5. بیک اپ اور برآمد", "جب آپ بیک اپ فائل بناتے ہیں یا PDF/CSV رپورٹ برآمد کرتے ہیں تو فائل آپ کے آلے پر بنتی ہے اور آپ خود طے کرتے ہیں کہ اسے کہاں بھیجنا یا محفوظ کرنا ہے (مثلاً فائلیں، Google Drive، iCloud یا ای میل)۔ ایپ یہ فائلیں خود کہیں نہیں بھیجتی۔"], ["6. خریداریاں", "Gemkeep Pro کی خریداریاں Google Play یا Apple App Store کے ذریعے مکمل ہوتی ہیں۔ ادائیگی کی معلومات ان کمپنیوں کے پاس رہتی ہیں اور ہمیں کبھی نظر نہیں آتیں۔ ان لین دین پر ان کی اپنی رازداری کی پالیسیاں لاگو ہوتی ہیں۔"], ["7. تجزیات، اشتہارات اور ٹریکنگ", "Gemkeep میں کوئی اشتہار، تجزیاتی یا ٹریکنگ ٹول نہیں ہے، اور یہ تیسرے فریق کے ساتھ ڈیٹا شیئر نہیں کرتا۔"], ["8. بچے", "Gemkeep ایک عمومی مالی ٹول ہے اور 13 سال سے کم عمر بچوں کے لیے نہیں ہے۔ چونکہ ہم ذاتی ڈیٹا جمع نہیں کرتے، اس لیے بچوں کی کوئی معلومات بھی ہمارے پاس نہیں۔"], ["9. تبدیلیاں", "اگر یہ پالیسی بدلے تو نیا ورژن نئی تاریخ کے ساتھ اسی صفحے پر شائع کیا جائے گا۔"], ["10. رابطہ", "سوالات:"]]}, "bn": {"name": "বাংলা", "dir": "ltr", "title": "Gemkeep – গোপনীয়তা নীতি", "upd": "সর্বশেষ হালনাগাদ", "intro": "Gemkeep একটি অফলাইন ব্যক্তিগত বাজেট অ্যাপ। এই নীতিতে ব্যাখ্যা করা হয়েছে অ্যাপ কোন তথ্য ব্যবহার করে। সংক্ষেপে: <b>আপনার আর্থিক তথ্য শুধু আপনার ডিভাইসেই থাকে। আমাদের কোনো সার্ভার বা ব্যবহারকারী অ্যাকাউন্ট নেই, এবং আমরা আপনার তথ্য সংগ্রহ করি না, গ্রহণ করি না, বিক্রিও করি না।</b>", "s": [["১. আপনার ডিভাইসে সংরক্ষিত তথ্য", "আপনি যা কিছু লেখেন (লেনদেন, অ্যাকাউন্ট, বিভাগ, বাজেট, সঞ্চয়, পুনরাবৃত্ত এন্ট্রি, সেটিংস) তা শুধু আপনার ফোনের স্থানীয় ডেটাবেসে সংরক্ষিত হয়। আমরা তা দেখতে পাই না। অ্যাপ মুছে ফেললে বা ফোন মুছে ফেললে এই তথ্য মুছে যাবে, যদি না আপনি নিজে ব্যাকআপ ফাইল তৈরি করে থাকেন।"], ["২. ক্যামেরা ও ছবি (রসিদ স্ক্যান)", "আপনি রসিদ স্ক্যান করতে চাইলে অ্যাপ ক্যামেরা বা ছবির অনুমতি চায়। ছবিটি আপনার ডিভাইসেই টেক্সট শনাক্তকরণের মাধ্যমে পড়া হয়, কোথাও আপলোড হয় না এবং Gemkeep তা সংরক্ষণ করে না। শুধু আপনার নিশ্চিত করা পরিমাণ, তারিখ ও দোকানের নাম লেনদেন হিসেবে সংরক্ষিত হয়।"], ["৩. বিজ্ঞপ্তি", "আপনি চালু করলে অনুস্মারক ও বাজেট সতর্কতা আপনার ডিভাইসেই স্থানীয়ভাবে তৈরি হয়। আমাদের কোনো বিজ্ঞপ্তি সেবা এতে জড়িত নয়।"], ["৪. অ্যাপ লক (পাসকোড / বায়োমেট্রিক)", "পাসকোড আপনার ডিভাইসের নিরাপদ সংরক্ষণস্থানে রাখা হয়। আঙুলের ছাপ বা মুখ শনাক্তকরণ আপনার ফোনের অপারেটিং সিস্টেম পরিচালনা করে; Gemkeep কখনো আপনার বায়োমেট্রিক তথ্য পায় না।"], ["৫. ব্যাকআপ ও এক্সপোর্ট", "আপনি ব্যাকআপ ফাইল তৈরি করলে বা PDF/CSV রিপোর্ট এক্সপোর্ট করলে ফাইলটি আপনার ডিভাইসে তৈরি হয় এবং কোথায় পাঠাবেন বা রাখবেন তা আপনি ঠিক করেন (যেমন ফাইলস, Google Drive, iCloud বা ইমেইল)। অ্যাপ নিজে থেকে এসব ফাইল কোথাও পাঠায় না।"], ["৬. কেনাকাটা", "Gemkeep Pro-এর কেনাকাটা Google Play বা Apple App Store প্রক্রিয়া করে। পেমেন্টের তথ্য ওই কোম্পানিগুলোর কাছে থাকে এবং আমরা তা কখনো দেখতে পাই না। এসব লেনদেনে তাদের নিজস্ব গোপনীয়তা নীতি প্রযোজ্য।"], ["৭. বিশ্লেষণ, বিজ্ঞাপন ও ট্র্যাকিং", "Gemkeep-এ কোনো বিজ্ঞাপন, বিশ্লেষণ বা ট্র্যাকিং টুল নেই, এবং তৃতীয় পক্ষের সঙ্গে তথ্য ভাগ করা হয় না।"], ["৮. শিশু", "Gemkeep একটি সাধারণ আর্থিক টুল এবং ১৩ বছরের কম বয়সী শিশুদের জন্য নয়। আমরা ব্যক্তিগত তথ্য সংগ্রহ করি না বলে শিশুদের কোনো তথ্যও আমাদের কাছে নেই।"], ["৯. পরিবর্তন", "এই নীতি বদলালে নতুন তারিখসহ নতুন সংস্করণ এই পাতায় প্রকাশ করা হবে।"], ["১০. যোগাযোগ", "প্রশ্ন থাকলে:"]]}};
var sel=document.getElementById('lang');
Object.keys(D).forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=D[k].name;sel.appendChild(o);});
function show(k){
  var d=D[k];
  document.documentElement.lang=k;document.documentElement.dir=d.dir;document.title=d.title;
  document.getElementById('title').textContent=d.title;
  document.getElementById('date').textContent=d.upd+': '+UPDATED;

    h+='<h2>'+x[0]+'</h2><p>'+x[1]+(i===9?' <b><a href="mailto:'+EMAIL+'">'+EMAIL+'</a></b>':'')+'</p>';
  });
  document.getElementById('body').innerHTML=h;
  sel.value=k;
  try{localStorage.setItem('lang',k);}catch(e){}
}
function pick(){
  var q=(location.search.match(/[?&]lang=([a-z]{2})/)||[])[1];
  if(q&&D[q])return q;
  try{var s=localStorage.getItem('lang');if(s&&D[s])return s;}catch(e){}
  var n=(navigator.languages&&navigator.languages[0]||navigator.language||'en').slice(0,2).toLowerCase();
  return D[n]?n:'en';
}
